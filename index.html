<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <title>विद्यार्थी दाखला व जनरल रजिस्टर पोर्टल</title>
    <!-- शासकीय आणि सुंदर मराठी फॉन्टसाठी Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans Devanagari', Arial, sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
        }
        .container { 
            max-width: 700px; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.15); 
            margin: auto; 
        }
        h2 { 
            text-align: center; 
            color: #1b4f72; 
            margin-bottom: 25px; 
            font-weight: 700;
            border-bottom: 2px solid #ebf5fb;
            padding-bottom: 10px;
        }
        .form-group { 
            margin-bottom: 20px; 
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600; 
            color: #2c3e50; 
        }
        input, button { 
            width: 100%; 
            padding: 12px; 
            font-size: 16px; 
            box-sizing: border-box; 
            border: 1px solid #bdc3c7; 
            border-radius: 6px; 
            font-family: 'Noto Sans Devanagari', sans-serif;
        }
        button { 
            background-color: #2e86c1; 
            color: white; 
            border: none; 
            font-weight: 700; 
            cursor: pointer; 
            transition: background 0.3s;
            margin-top: 5px;
        }
        button:hover { 
            background-color: #2471a3; 
        }
        #loginBox {
            background: #fdfefe;
            padding: 20px;
            border: 1px solid #d4efdf;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        #appContent {
            display: none; /* पासवर्ड टाकल्याशिवाय मुख्य भाग लपलेला असेल */
        }
        .result-card { 
            margin-top: 25px; 
            padding: 20px; 
            background: #f4ecf7; 
            border: 1px solid #d7bde2; 
            border-radius: 8px; 
            font-size: 16px; 
            color: #512e5f; 
            line-height: 1.8;
        }
        .result-card h3 {
            margin-top: 0;
            color: #4a235a;
            border-bottom: 1px solid #c39bd3;
            padding-bottom: 8px;
        }
        .print-btn {
            background-color: #27ae60;
            margin-top: 15px;
        }
        .print-btn:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏫 शाळा सोडल्याचा दाखला व रजिस्टर पोर्टल</h2>
    
    <!-- पासवर्ड लॉगिन बॉक्स -->
    <div id="loginBox">
        <div class="form-group">
            <label>कृपया प्रणालीचा पासवर्ड प्रविष्ट करा:</label>
            <input type="password" id="passInput" placeholder="पास पासवर्ड टाка (उदा. admin123)">
        </div>
        <button onclick="checkPassword()">लॉगिन करा</button>
    </div>

    <!-- मुख्य ॲप डॅशबोर्ड (पासवर्ड दिल्यावर दिसेल) -->
    <div id="appContent">
        <div class="form-group">
            <label>📁 एक्सेल फाईल अपलोड करा (.xlsx, .xlsm, .csv):</label>
            <input type="file" id="excelFile" accept=".xlsx, .xls, .csv, .xlsm">
        </div>

        <div class="form-group">
            <label>🔍 जनरल रजिस्टर नंबर:</label>
            <input type="text" id="regNo" placeholder="विद्यार्थ्याचा रजिस्टर नंबर टाका">
        </div>

        <button onclick="searchStudent()">विद्यार्थ्याची माहिती शोधा</button>

        <div id="result" class="result-card" style="display:none;">
            <h3>📋 विद्यार्थ्याची व दाखल्याची सविस्तर माहिती</h3>
            <div id="resultText">माहिती येथे दिसेल...</div>
            <button class="print-btn" onclick="window.print()">🖨️ दाखला प्रिंट करा</button>
        </div>
    </div>
</div>

<!-- एक्सेल वाचण्यासाठी आवश्यक लायब्ररी -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
// येथे तुम्ही हवा तो नवीन पासवर्ड सेट करू शकता
const CORRECT_PASSWORD = "admin123"; 

function checkPassword() {
    let enteredPass = document.getElementById('passInput').value.trim();
    if(enteredPass === CORRECT_PASSWORD) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('appContent').style.display = 'block';
    } else {
        alert("चुकीचा पासवर्ड! कृपया पुन्हा प्रयत्न करा.");
    }
}

const marathiMonths = {
    1: "जानेवारी", 2: "फेब्रुवारी", 3: "मार्च", 4: "एप्रिल", 
    5: "मे", 6: "जून", 7: "जुलै", 8: "ऑगस्ट", 
    9: "सप्टेंबर", 10: "ऑक्टोबर", 11: "नोव्हेंबर", 12: "डिसेंबर"
};

function numberToMarathiWords(n) {
    const words = {
        1: "पहिली", 2: "दोन", 3: "तीन", 4: "चार", 5: "पाच", 
        6: "सहा", 7: "सात", 8: "आठ", 9: "नऊ", 10: "दहा",
        11: "अकरा", 12: "बारा", 13: "तेरा", 14: "चौदा", 15: "पंधरा", 
        16: "सोळा", 17: "सतरा", 18: "अठरा", 19: "एकोणीस", 20: "वीस",
        21: "एकवीस", 22: "बावीस", 23: "तेवीस", 24: "चोवीस", 25: "पंचवीस", 
        26: "सव्वीस", 27: "सत्तावीस", 28: "अठ्ठावीस", 29: "एकूणतीस", 30: "तीस", 
        31: "एकतीस"
    };
    return words[n] || n;
}

function excelDateToJSDate(serial) {
    if (isNaN(serial)) return serial;
    let utc_days = Math.floor(serial - 25569);
    let utc_value = utc_days * 86400;
    return new Date(utc_value * 1000);
}

function dateToMarathi(dateVal) {
    try {
        let d;
        if (typeof dateVal === 'number') {
            d = excelDateToJSDate(dateVal);
        } else {
            d = new Date(dateVal);
        }
        
        if (isNaN(d)) return dateVal;
        let day = d.getDate();
        let month = d.getMonth() + 1;
        let year = d.getFullYear();
        
        let dayWord = numberToMarathiWords(day);
        let monthWord = marathiMonths[month] || "";
        return `${dayWord} ${monthWord} सन ${year}`;
    } catch(e) {
        return dateVal;
    }
}

let excelData = [];

document.getElementById('excelFile').addEventListener('change', function(e) {
    let reader = new FileReader();
    reader.onload = function(evt) {
        let data = new Uint8Array(evt.target.result);
        let workbook = XLSX.read(data, {type: 'array'});
        let firstSheet = workbook.SheetNames[0];
        let worksheet = workbook.Sheets[firstSheet];
        excelData = XLSX.utils.sheet_to_json(worksheet, {header: 1});
        alert("एक्सेल फाईल यशस्वीपणे अपलोड झाली!");
    };
    reader.readAsArrayBuffer(e.target.files[0]);
});

function searchStudent() {
    let regNo = document.getElementById('regNo').value.trim();
    if(!regNo) {
        alert("कृपया जनरल रजिस्टर नंबर प्रविष्ट करा!");
        return;
    }
    if(excelData.length === 0) {
        alert("कृपया आधी एक्सेल फाईल अपलोड करा!");
        return;
    }

    let foundRow = null;
    for(let row of excelData) {
        let rowString = row.join(" ");
        if(rowString.includes(regNo)) {
            foundRow = row;
            break;
        }
    }

    if(!foundRow) {
        document.getElementById('result').style.display = 'block';
        document.getElementById('resultText').innerText = "या रजिस्टर नंबरची कोणतीही नोंद आढळली नाही.";
        return;
    }

    // एक्सेल फाईलमधील माहितीचे रकाने
    let studentName = foundRow[2] || foundRow[1] || "माहित नाही"; 
    let dobRaw = foundRow[4] || foundRow[3] || "";
    let dobMarathi = dateToMarathi(dobRaw);
    let birthPlace = foundRow[5] || "महाराष्ट्र"; // नवीन रकाना
    let caste = foundRow[6] || "हिंदू - मराठा"; // नवीन रकाना
    let progress = foundRow[7] || "प्रगतीशील / उत्तम"; // नवीन रकाना

    let infoHtml = `
        <strong>जनरल रजिस्टर नंबर:</strong> ${regNo}<br>
        <strong>विद्यार्थ्याचे पूर्ण नाव:</strong> ${studentName}<br>
        <strong>जन्मदिनांक (अंकात):</strong> ${dobRaw}<br>
        <strong>जन्मदिनांक (अक्षरी):</strong> ${dobMarathi}<br>
        <strong>जन्मस्थान:</strong> ${birthPlace}<br>
        <strong>जात व उपजात:</strong> ${caste}<br>
        <strong>विद्यार्थ्याचे वर्तन व प्रगती:</strong> ${progress}
    `;

    document.getElementById('result').style.display = 'block';
    document.getElementById('resultText').innerHTML = infoHtml;
}
</script>

</body>
</html>
